<style>

html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg2);background:linear-gradient(var(--bg1),var(--bg2)) fixed;overscroll-behavior:none;background-color:var(--bg2)}

#sky span{position:absolute;opacity:.5;animation:fl linear infinite}
@keyframes fl{from{transform:translateX(-15vw) rotate(0)}to{transform:translateX(115vw) rotate(360deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px 10px 30px;text-align:center}
h1{margin:4px 0 0;font-size:clamp(1.6rem,7vw,2.6rem);letter-spacing:.04em;background:linear-gradient(90deg,#1f8fd8,#1f9d63,#d9a400);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:2px 0 8px;font-style:italic;opacity:.85}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(max-width:430px){.st{grid-template-columns:repeat(3,1fr)}}
.st div,#pop,.pw button{background:var(--card);border:1px solid var(--bd);border-radius:12px;backdrop-filter:blur(4px)}
.pg{background:var(--card);border:1px solid var(--bd);border-radius:12px;backdrop-filter:blur(4px)}
.st div{padding:6px 2px;font-size:.62rem;letter-spacing:.05em;font-weight:700;opacity:.95}
.st b{display:block;font-size:1.15rem;letter-spacing:0}
.pg{margin:8px 0;padding:8px 10px;font-size:.8rem}

.bar{height:12px;background:var(--cell);border-radius:8px;overflow:hidden}

#bw{display:flex;justify-content:center}
#bd{width:min(94vw,520px);padding:2.2%;background:var(--board);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-user-select:none}
#bi{position:relative;width:100%;aspect-ratio:1}
#bg{position:absolute;inset:0;display:grid;grid:repeat(4,1fr)/repeat(4,1fr)}
.c{position:relative}.c i{position:absolute;inset:4%;background:var(--cell);border-radius:12%}
#tl{position:absolute;inset:0}
.t{position:absolute;left:0;top:0;width:25%;height:25%;container-type:size;transition:transform .08s ease-out}
.t .i{position:absolute;inset:4%;border-radius:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 2px 4px rgba(255,255,255,.3);line-height:1.05;text-align:center}
.i b{font-size:36cqw;font-weight:400;text-shadow:none}.i em{font-style:normal;font-weight:800;font-size:19cqw}.i small{font-size:9.5cqw;font-weight:600;padding:0 4cqw}
.pop .i{animation:pop .2s .05s both}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}

#pop.on{opacity:1;transform:none}

.pw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
@media(max-width:520px){.pw{grid-template-columns:repeat(2,1fr)}}
.pw button{padding:7px 4px;color:var(--ink);cursor:pointer;font-size:.72rem;font-weight:700}

@keyframes pulse{50%{box-shadow:0 0 14px var(--ac)}}

button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.45}
button.off{background:#8a8f94}button.g{background:#556}

.vol{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;font-size:.85rem}.vol input{width:min(34vw,150px)}
#m{position:fixed;inset:0;z-index:50;background:rgba(5,25,20,.6);display:none;align-items:center;justify-content:center;padding:14px}
#m.on{display:flex}
.mb{background:var(--bg2);background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);border-radius:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .3s both}
.mb h2{margin:0 0 6px}.mb p{margin:6px 0}.mb button{margin:4px}
.mb ul{text-align:left;padding-left:20px;font-size:.85rem}.lk{opacity:.5}
.vic{background:linear-gradient(160deg,#1f8fd8,#1f9d63 55%,#e8b923);color:#fff}
.mb .ex{font-size:1.5rem;margin:4px 0}
#nt{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#nt div{background:#0f4d33;color:#fff;padding:8px 14px;border-radius:20px;font-size:.82rem;font-weight:700;animation:pop .3s both;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:92vw}
#cf{position:fixed;inset:0;z-index:70;pointer-events:none}

<main>
<h1>🌎 VISION 2048</h1>
<p class="tag">Every Merge Brings Us Closer to Cleaner Air!</p>
<section class="st" id="st"></section>
<section class="pg"><div class="pgt"><span id="pl"></span><span id="pp"></span></div><div class="bar"><i id="pf"></i></div><small>Game progress based on your highest tile – not a real air-quality measurement.</small></section>
<div id="bw"><div id="bd"><div id="bi"><div id="bg"></div><div id="tl"></div></div></div></div>

<button id="bN">NEW GAME</button><button id="bAI" class="ai-btn">🤖 AI AUTO-PLAY</button><button id="bU" class="g">↩ UNDO</button><button id="bH" class="g">? HOW TO PLAY</button>
<button id="bS">🔊 SOUND</button><button id="bM">🎵 MUSIC</button><button id="bT" class="g">💡 TIPS</button><button id="bR" class="g">RESET</button>
</div>
<div class="vol">🎵<input type="range" id="vm" min="0" max="100" aria-label="Music volume">🔊<input type="range" id="vs" min="0" max="100" aria-label="Sound effects volume"></div>
</main>

<script>
const $=s=>document.querySelector(s);
const LV=[
["🚲","Bicycle","Choose cycling for short journeys to reduce vehicle emissions."],
["🚗","Electric Vehicle","Electric vehicles have no tailpipe emissions, although their electricity and manufacturing have environmental impacts."],
["🚌","Public Transport","Public transport can reduce emissions per passenger compared with individual car journeys."],
["🚌","Electric Bus","Electric buses can reduce roadside exhaust pollution."],
["🌳","Tree","Trees absorb carbon dioxide and support healthier urban environments."],
["🌲","Green Forest","Protecting forests supports biodiversity and ecological balance."],
["☀️","Solar Energy","Solar power generates electricity without direct combustion emissions."],
["🌬️","Clean Energy","Cleaner electricity can help reduce pollution from fossil fuels."],
["🏞️","Green Park","Urban green spaces improve the quality of city environments."],
["🌍","Clean Environment","Cleaner air starts with reducing pollution at its source."],
["🌎","Clean Air City","Every citizen can contribute to a healthier city!"]];
const CL=["linear-gradient(145deg,#aab2bd,#7f8896)","linear-gradient(145deg,#f7b25e,#e8862a)","linear-gradient(145deg,#5db4f2,#2f86d6)","linear-gradient(145deg,#3a8fe0,#2468b8)","linear-gradient(145deg,#37d1c2,#1aa89c)","linear-gradient(145deg,#8fe29f,#4cbf6b)","linear-gradient(145deg,#33a862,#1f8248)","linear-gradient(145deg,#1f9a63,#0f7a4a)","linear-gradient(145deg,#12805a,#0a5c3e)","linear-gradient(145deg,#2f8fd8,#10a874)","linear-gradient(145deg,#2f9bd8,#22b573 45%,#f2c230)"];
const TIPS=["Walk or cycle for short journeys.","Use public transport whenever you can.","Avoid unnecessary vehicle idling – switch the engine off while waiting.","Keep vehicle engines properly maintained.","Never burn garbage, leaves or crop waste.","Save electricity: switch off lights and appliances you are not using.","Support renewable energy such as solar and wind.","Carpool: fewer cars on the road means less exhaust.","Cover construction materials and sites to reduce dust.","Use cleaner cooking fuels and stoves.","Plant and care for trees in your neighbourhood.","Avoid unnecessary energy consumption at home and work.","Reduce, reuse and recycle waste.","Check tyre pressure regularly – it improves fuel efficiency.","Choose electric or low-emission vehicles when you can.","Avoid burning firecrackers and open fires.","Ventilate indoor spaces and avoid indoor smoke.","Choose energy-efficient appliances.","Buy local goods to cut transport emissions.","Report illegal burning or visible smoke to local authorities.","Combine errands or work from home to reduce trips.","Switch to LED lighting.","Support clean public transport expansion in your city.","Compost organic waste instead of burning it.","Check your local air-quality index before outdoor exercise.","Talk to friends and family about clean-air habits."];
const PW={boost:["🌱","Green Boost","Remove one tile worth 16 or less."],blast:["🌬️","Clean Air Blast","Clear a chosen row or column."],recycle:["♻️","Recycling Power","Upgrade one tile to the next level."],shield:["🌳","Tree Shield","No new tile after your next move."]};
const AD=[["first","🚲","First Green Move"],["expl","🌱","Eco Explorer"],["tree","🌳","Tree Champion"],["sol","☀️","Solar Hero"],["adv","🌍","Clean Air Advocate"],["champ","🏆","2048 Clean Air Champion"]];
const MS=[[10,"Pollution Beginner"],[25,"Eco Explorer"],[40,"Green Warrior"],[60,"Clean Air Champion"],[80,"Planet Protector"],[100,"Clean Air City Master"]];
const lv=v=>Math.log2(v)-1;
let S,best=0,snap=null,pend=null,ms="",P={m:.5,s:.7,mm:0,sm:0};
let aiTimer=null;

/* ---------- storage ---------- */
function save(){try{S.t.forEach(t=>t.n=0);localStorage.setItem("bb2048",JSON.stringify({S,best}))}catch(e){}}
function savePrefs(){try{localStorage.setItem("bb2048p",JSON.stringify(P))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem("bb2048"));if(d&&d.S&&d.S.t){S=d.S;best=d.best||0;}}catch(e){}
try{const p=JSON.parse(localStorage.getItem("bb2048p"));if(p)P=Object.assign(P,p)}catch(e){}}

/* ---------- audio ---------- */
let AC,mg,sg;
function init(){if(AC){if(AC.state=="suspended")AC.resume();return}
try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
mg=AC.createGain();sg=AC.createGain();mg.connect(AC.destination);sg.connect(AC.destination);vol();music()}
function vol(){if(!AC)return;mg.gain.value=P.mm?0:P.m*.4;sg.gain.value=P.sm?0:P.s}
function tone(f,t0,d,ty,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+d+.05)}
function sfx(n,l=0){if(!AC||AC.state!="running"||aiTimer)return;const t=AC.currentTime,T=(f,d,ty,v,o)=>tone(f,t+(o||0),d,ty||"sine",v||.25,sg);
if(n=="slide")T(180,.08,"triangle",.12);
else if(n=="merge"){const f=330*Math.pow(2,l/6);T(f,.2,"sine",.3);T(f*1.5,.2,"sine",.2,.06)}
else if(n=="big")[523,659,784,1047].forEach((f,i)=>T(f,.3,"triangle",.25,i*.07));
else if(n=="power"){T(300,.3,"sawtooth",.1);T(600,.3,"sine",.2,.1);T(900,.3,"sine",.15,.2)}
else if(n=="eco")T(1200,.1,"sine",.15);
else if(n=="mile")[523,659,784].forEach((f,i)=>T(f,.4,"triangle",.25,i*.12));
else if(n=="click")T(700,.05,"square",.07);
else if(n=="win")[523,659,784,1047,1319,1568].forEach((f,i)=>T(f,.5,"triangle",.28,i*.15));
else if(n=="over")[392,330,262,196].forEach((f,i)=>T(f,.4,"sawtooth",.14,i*.2))}
function music(){const ch=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]],ar=[0,1,2,1,2,1,0,2];let st=0,nt=AC.currentTime+.1;
setInterval(()=>{if(AC.state!="running")return;if(nt<AC.currentTime)nt=AC.currentTime+.05;
while(nt<AC.currentTime+.4){const c=ch[Math.floor(st/8)%4],i=st%8;
if(i==0)c.forEach(f=>tone(f/2,nt,2.4,"sine",.16,mg));
tone(c[ar[i]]*2,nt,.5,"triangle",.2,mg);
if(i%4==0)tone(c[2]*4,nt,.9,"sine",.06,mg);
nt+=.3;st++}},100)}
document.addEventListener("visibilitychange",()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});

/* ---------- helpers ---------- */
function note(h,ms=2600){if(aiTimer)return;const d=document.createElement("div");d.innerHTML=h;$("#nt").appendChild(d);setTimeout(()=>d.remove(),ms)}
function modal(h,cls){$("#m").innerHTML='<div class="mb '+(cls||"")+'">'+h+'</div>';$("#m").classList.add("on")}
function closeM(){$("#m").classList.remove("on");sfx("click")}
const isOpen=()=>$("#m").classList.contains("on");
let FN=[];function btn(l,f,c){FN.push(f);return '<button class="'+(c||"")+'" onclick="FN['+(FN.length-1)+']()">'+l+'</button>'}
function ask(msg,opts){FN=[];modal("<h2>Please confirm</h2><p>"+msg+"</p>"+opts.map(o=>btn(o[0],()=>{closeM();o[1]&&o[1]()},o[2])).join(""))}
function confetti(n=120){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
const ps=[...Array(n)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:Math.random()*4-2,vy:2+Math.random()*4,s:5+Math.random()*6,h:Math.random()*360,r:Math.random()*6}));let f=0;
(function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.fillStyle="hsl("+p.h+",85%,55%)";x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(f++<200)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- game core ---------- */
let nextId = 1;
function newGame(){stopAI();S={t:[],score:0,moves:0,eco:0,hi:2,ach:[],pw:{boost:1,blast:1,recycle:1,shield:1},won:0,shield:0,over:0};snap=null;pend=null;ms="";nextId=1;spawn();spawn();sync();ui();save()}
function spawn(){const used=new Set(S.t.map(t=>t.r*4+t.c)),e=[];for(let i=0;i<16;i++)if(!used.has(i))e.push(i);if(!e.length)return;
const k=e[Math.floor(Math.random()*e.length)];S.t.push({id:nextId++,v:Math.random()<.9?2:4,r:k>>2,c:k&3,n:1})}
const EM={};
function sync(g){g=g||[];const all=S.t.concat(g),ids=new Set(all.map(t=>String(t.id)));
for(const id in EM)if(!ids.has(id)){EM[id].remove();delete EM[id]}
all.forEach(t=>{let e=EM[t.id];if(!e){const l=lv(t.v);e=document.createElement("div");e.className="t"+(t.n?" pop":"");
e.innerHTML='<div class="i" style="background:'+CL[l]+'"><b>'+LV[l][0]+'</b><em>'+t.v+'</em><small>'+LV[l][1]+'</small></div>';
e.style.transform="translate("+t.c*100+"%,"+t.r*100+"%)";$("#tl").appendChild(e);EM[t.id]=e;t.n=0}
e.style.transform="translate("+t.c*100+"%,"+t.r*100+"%)"})}
function canMove(){if(S.t.length<16)return true;const g={};S.t.forEach(t=>g[t.r*4+t.c]=t.v);
for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=g[r*4+c];if((c<3&&g[r*4+c+1]==v)||(r<3&&g[(r+1)*4+c]==v))return true}return false}
function move(dir){if(isOpen()||S.over)return false;const horiz=dir=="L"||dir=="R",rev=dir=="R"||dir=="D",before=JSON.stringify(S);
let moved=false,merges=[],gain=0;
for(let k=0;k<4;k++){let line=S.t.filter(t=>horiz?t.r==k:t.c==k).sort((a,b)=>horiz?a.c-b.c:a.r-b.r);if(rev)line.reverse();let pos=0;
const set=(t,p)=>{const q=rev?3-p:p,nr=horiz?k:q,nc=horiz?q:k;if(t.r!=nr||t.c!=nc)moved=true;t.r=nr;t.c=nc};
for(let i=0;i<line.length;i++){const t=line[i],n=line[i+1];
if(n&&n.v==t.v){set(t,pos);set(n,pos);merges.push({a:t,b:n,r:t.r,c:t.c,v:t.v*2});gain+=t.v*2;i++;moved=true}else set(t,pos);pos++}}
if(!moved)return false;
pend=null;snap=before;
const ghosts=merges.flatMap(m=>[m.a,m.b]);S.t=S.t.filter(t=>!ghosts.includes(t));
let top=0;merges.forEach(m=>{S.t.push({id:nextId++,v:m.v,r:m.r,c:m.c,n:1});top=Math.max(top,m.v);S.eco+=lv(m.v)+1});
S.score+=gain;S.moves++;if(S.score>best)best=S.score;
if(S.shield){S.shield=0;if(!aiTimer)note("🌳 Tree Shield used – no new tile")}else spawn();
sfx("slide");if(top){sfx(top>=128?"big":"merge",lv(top));setTimeout(()=>sfx("eco"),180)}
if(!S.ach.includes("first"))unlock("first");
if(top){hiCheck(top);popup(lv(top))}
sync(ghosts);setTimeout(()=>sync(),100);ui();save();
if(!canMove()){S.over=1;stopAI();save();sfx("over");setTimeout(gameOver,650)}
return true;}
function hiCheck(v){if(v>S.hi){S.hi=v;const l=lv(v);if(!aiTimer)note("⬆️ Level up! "+LV[l][0]+" "+LV[l][1]);sfx("mile");
if(v==128||v==512){const k=Object.keys(PW)[Math.floor(Math.random()*4)];S.pw[k]++;if(!aiTimer)note("🎁 Power-up earned: "+PW[k][0]+" "+PW[k][1]);sfx("power")}}
if(v>=16)unlock("expl");if(v>=32)unlock("tree");if(v>=128)unlock("sol");if(v>=1024)unlock("adv");
if(v>=2048){unlock("champ");if(!S.won){S.won=1;save();stopAI();setTimeout(victory,600)}}}
function unlock(k){if(S.ach.includes(k))return;S.ach.push(k);const a=AD.find(x=>x[0]==k);if(!aiTimer){note("🏅 Achievement: "+a[1]+" "+a[2],3200);confetti(50)}sfx("mile")}
let pt;function popup(l){if(aiTimer)return;$("#pe").textContent=LV[l][0];$("#pt").textContent=LV[l][2];$("#pop").classList.add("on");clearTimeout(pt);pt=setTimeout(()=>$("#pop").classList.remove("on"),5000)}
function undo(){if(!snap||isOpen())return;S=JSON.parse(snap);snap=null;pend=null;sync();ui();save();sfx("click")}

/* ---------- power-ups ---------- */
function pick(k){if(isOpen()||S.over)return;init();
if(S.pw[k]<=0)return note("No "+PW[k][1]+" uses left");
if(k=="shield"){if(S.shield)return note("Tree Shield already active");snap=JSON.stringify(S);S.pw[k]--;S.shield=1;sfx("power");note("🌳 Tree Shield ready: your next move adds no tile");ui();save();return}
pend=pend==k?null:k;sfx("click");ui()}
function usePw(r,c){const k=pend,t=S.t.find(t=>t.r==r&&t.c==c);
const done=()=>{S.pw[k]--;pend=null;sfx("power");sync();ui();save()};
if(k=="boost"){if(!t||t.v>16)return note("Pick a tile worth 16 or less");
ask("Remove this "+LV[lv(t.v)][0]+" "+LV[lv(t.v)][1]+" tile?",[["REMOVE",()=>{snap=JSON.stringify(S);S.t=S.t.filter(x=>x!=t);done()}],["CANCEL",null,"g"]])}
else if(k=="blast"){const cut=f=>()=>{snap=JSON.stringify(S);S.t=S.t.filter(x=>!f(x));done()};
ask("Clear row "+(r+1)+" or column "+(c+1)+"? Tiles there will be lost.",[["CLEAR ROW",cut(x=>x.r==r)],["CLEAR COLUMN",cut(x=>x.c==c)],["CANCEL",null,"g"]])}
else if(k=="recycle"){if(!t||lv(t.v)>=10)return note("Pick a tile below Clean Air City");
ask("Upgrade this "+LV[lv(t.v)][1]+" to "+LV[lv(t.v)+1][1]+"?",[["UPGRADE",()=>{snap=JSON.stringify(S);S.t=S.t.filter(x=>x!=t);const v=t.v*2;S.t.push({id:nextId++,v,r,c,n:1});hiCheck(v);done();if(!canMove()){S.over=1;gameOver()}}],["CANCEL",null,"g"]])}}

/* ---------- ADVANCED EXPECTIMAX AI ENGINE ---------- */
function simulateMoveGrid(grid, dir) {
    const horiz = dir=="L"||dir=="R", rev = dir=="R"||dir=="D";
    let newGrid = grid.map(row => [...row]);
    let moved = false, scoreGain = 0;

    for(let k=0; k<4; k++) {
        let line = [];
        for(let i=0; i<4; i++) {
            let r = horiz ? k : i;
            let c = horiz ? i : k;
            if(newGrid[r][c] > 0) line.push(newGrid[r][c]);
        }
        if(rev) line.reverse();
        
        let mergedLine = [];
        for(let i=0; i<line.length; i++) {
            if(i + 1 < line.length && line[i] === line[i+1]) {
                let mergedVal = line[i] * 2;
                mergedLine.push(mergedVal);
                scoreGain += mergedVal;
                i++;
                moved = true;
            } else {
                mergedLine.push(line[i]);
            }
        }
        while(mergedLine.length < 4) mergedLine.push(0);
        if(rev) mergedLine.reverse();

        for(let i=0; i<4; i++) {
            let r = horiz ? k : i;
            let c = horiz ? i : k;
            if(newGrid[r][c] !== mergedLine[i]) moved = true;
            newGrid[r][c] = mergedLine[i];
        }
    }
    return { grid: newGrid, moved, scoreGain };
}

function evaluateGrid(grid) {
    let emptyCount = 0;
    let maxTile = 0;
    let smoothness = 0;
    let monotonicity = 0;

    // Snake weighting matrix favoring top-left corner / edges for high value tiles
    const weights = [
        [131072, 65536, 32768, 16384],
        [1024,   2048,  4096,  8192],
        [512,    256,   128,   64],
        [4,      8,     16,    32]
    ];
    let weightedSum = 0;

    for(let r=0; r<4; r++) {
        for(let c=0; c<4; c++) {
            let v = grid[r][c];
            if(v === 0) {
                emptyCount++;
            } else {
                if(v > maxTile) maxTile = v;
                weightedSum += v * weights[r][c];
            }
            if(c < 3) smoothness -= Math.abs(v - grid[r][c+1]);
            if(r < 3) smoothness -= Math.abs(v - grid[r+1][c]);
        }
    }

    // Monotonicity check across rows and columns
    for(let r=0; r<4; r++) {
        for(let c=0; c<3; c++) {
            if(grid[r][c] >= grid[r][c+1]) monotonicity += 1;
        }
    }
    for(let c=0; c<4; c++) {
        for(let r=0; r<3; r++) {
            if(grid[r][c] >= grid[r+1][c]) monotonicity += 1;
        }
    }

    // Heavy reward for empty spaces, corner anchoring, and snake structure
    let emptyBonus = Math.log(emptyCount + 1) * 50000;
    return weightedSum + emptyBonus + (smoothness * 0.2) + (monotonicity * 2000);
}

function expectimax(grid, depth, isPlayerTurn) {
    if(depth === 0) {
        return evaluateGrid(grid);
    }

    if(isPlayerTurn) {
        let maxVal = -Infinity;
        const dirs = ["L", "U", "R", "D"];
        let anyValid = false;
        for(let dir of dirs) {
            let res = simulateMoveGrid(grid, dir);
            if(res.moved) {
                anyValid = true;
                let val = expectimax(res.grid, depth - 1, false);
                if(val > maxVal) maxVal = val;
            }
        }
        return anyValid ? maxVal : evaluateGrid(grid) - 100000;
    } else {
        // Chance node: average over all empty cells spawning 2 (90%) or 4 (10%)
        let emptyCells = [];
        for(let r=0; r<4; r++) {
            for(let c=0; c<4; c++) {
                if(grid[r][c] === 0) emptyCells.push({r, c});
            }
        }
        if(emptyCells.length === 0) return evaluateGrid(grid);

        let totalScore = 0;
        let count = 0;
        // Sample empty cells if there are too many to keep performance lightning fast
        let sample = emptyCells.length > 6 ? emptyCells.sort(() => 0.5 - Math.random()).slice(0, 6) : emptyCells;

        for(let cell of sample) {
            // Test value 2 (probability 0.9)
            grid[cell.r][cell.c] = 2;
            totalScore += 0.9 * expectimax(grid, depth - 1, true);
            // Test value 4 (probability 0.1)
            grid[cell.r][cell.c] = 4;
            totalScore += 0.1 * expectimax(grid, depth - 1, true);
            grid[cell.r][cell.c] = 0; // backtrack
            count++;
        }
        return totalScore / count;
    }
}

function getBestMove() {
    let grid = Array(4).fill(0).map(()=>Array(4).fill(0));
    S.t.forEach(t => {
        if(t.r >= 0 && t.r < 4 && t.c >= 0 && t.c < 4) {
            grid[t.r][t.c] = t.v;
        }
    });

    const dirs = ["L", "U", "R", "D"];
    let bestDir = null;
    let maxScore = -Infinity;
    // Dynamic search depth based on number of empty tiles (deeper when fewer tiles for precision)
    let emptyCount = grid.flat().filter(v => v === 0).length;
    let searchDepth = emptyCount <= 4 ? 4 : 3;

    for(let dir of dirs) {
        let res = simulateMoveGrid(grid, dir);
        if(res.moved) {
            let score = expectimax(res.grid, searchDepth, false);
            if(score > maxScore) {
                maxScore = score;
                bestDir = dir;
            }
        }
    }
    return bestDir;
}

function toggleAI() {
    if(aiTimer) {
        stopAI();
        note("🤖 AI Auto-Play Paused");
    } else {
        if(S.over || S.won) return;
        init();
        if(isOpen()) closeM();
        aiTimer = setInterval(() => {
            if(S.over || S.won || isOpen()) {
                stopAI();
                return;
            }
            let bestDir = getBestMove();
            if(bestDir) {
                move(bestDir);
            } else {
                const fallback = ["L", "U", "R", "D"].find(d => simulateMoveGrid(
                    (() => { let g = Array(4).fill(0).map(()=>Array(4).fill(0)); S.t.forEach(t => g[t.r][t.c] = t.v); return g; })(), d
                ).moved);
                if(fallback) move(fallback);
                else stopAI();
            }
        }, 40);
        note("🤖 Smart AI Auto-Play Active – Maximizing Score & Level!");
        $("#bAI").textContent = "⏸ STOP AI";
        $("#bAI").style.background = "#d9534f";
    }
}

function stopAI() {
    if(aiTimer) {
        clearInterval(aiTimer);
        aiTimer = null;
    }
    $("#bAI").textContent = "🤖 AI AUTO-PLAY";
    $("#bAI").style.background = "";
}
